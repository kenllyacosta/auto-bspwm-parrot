name: checks
on: [push, pull_request]
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n install.sh
          find Config scripts -type f | while read -r file; do
            if head -n 1 "$file" | grep -Eq '^#!.*(bash|/sh)$'; then
              bash -n "$file"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y zsh
          zsh -n .zshrc
      - name: Python tests
        run: python3 -m unittest discover -s tests -v