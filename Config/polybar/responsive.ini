[colors]
background = #e62e3440
foreground = #eceff4
accent = #88c0d0
muted = #7b88a1

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = Iosevka Nerd Font:size=10;2
padding = 1
module-margin = 1
modules-left = bspwm
modules-right = ${env:BSPWM_STATUS_MODULES:date powermenu}
wm-restack = bspwm
enable-ipc = true

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
label-focused = %name%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.background}
label-focused-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1
label-urgent = %name%!
label-urgent-padding = 1

[module/ethernet_status]
type = custom/script
exec = ~/.config/bin/ethernet_status.sh
interval = 3

[module/htb_status]
type = custom/script
exec = ~/.config/bin/htb_status.sh
interval = 3

[module/htb_target]
type = custom/script
exec = ~/.config/bin/htb_target.sh
interval = 3
label-maxlen = 24

[module/pulseaudio]
type = internal/pulseaudio
label-volume = VOL %percentage%%
label-muted = muted
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = ${env:BSPWM_BATTERY:BAT0}
adapter = ${env:BSPWM_ADAPTER:AC}
format-charging = <label-charging>
format-discharging = <label-discharging>
label-charging = BAT +%percentage%%
label-discharging = BAT %percentage%%
label-full = BAT full

[module/date]
type = internal/date
interval = 5
date = %d/%m %H:%M
label = %date%

[module/powermenu]
type = custom/text
content = Power
click-left = ~/.config/polybar/scripts/powermenu_alt

[settings]
screenchange-reload = true
